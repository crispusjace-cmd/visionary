<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visionary Junior School — v3.0</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="api.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --f:#0e2d1e;--fm:#163d28;--fl:#1e5236;
  --g:#c9a84c;--gb:#e4c46e;--gp:rgba(201,168,76,.1);
  --w:#fff;--cr:#f8f4ef;--bg:#eef2ef;
  --td:#0a1f13;--tm:#2e4d38;--tl:#5a7a63;--tmu:#8aa892;
  --bd:rgba(14,45,30,.08);--bdm:rgba(14,45,30,.14);
  --bs:0 1px 8px rgba(14,45,30,.07);--bm:0 4px 20px rgba(14,45,30,.11);
  --r:8px;--rl:14px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--td);min-height:100vh;font-size:14px;}
/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--f);}
.login-box{background:var(--w);border-radius:24px;padding:44px 40px;width:100%;max-width:440px;}
.login-logo{text-align:center;margin-bottom:28px;}
.login-icon{width:56px;height:56px;background:var(--f);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;}
.login-icon i{font-size:26px;color:var(--g);}
.login-title{font-size:21px;font-weight:700;color:var(--f);}
.login-sub{font-size:13px;color:var(--tmu);margin-top:4px;}
.fl{margin-bottom:16px;}
.fl label{display:block;font-size:11.5px;font-weight:600;color:var(--tm);letter-spacing:.4px;margin-bottom:5px;text-transform:uppercase;}
.fl input{width:100%;padding:11px 14px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:14px;font-family:inherit;color:var(--td);background:var(--cr);outline:none;transition:border .2s;}
.fl input:focus{border-color:var(--g);background:var(--w);}
.role-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:22px;}
.role-tab{padding:9px 6px;border-radius:var(--r);border:1.5px solid var(--bd);background:var(--cr);cursor:pointer;text-align:center;font-size:11.5px;font-weight:600;color:var(--tl);transition:all .2s;font-family:inherit;}
.role-tab i{display:block;font-size:16px;margin-bottom:4px;}
.role-tab.sel{background:var(--f);color:var(--g);border-color:var(--f);}
.btn-login{width:100%;padding:13px;border-radius:50px;background:var(--f);color:#fff;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-login:disabled{opacity:.6;cursor:not-allowed;}
.login-error{background:#fde8e8;color:#9b2626;border-radius:var(--r);padding:10px 14px;font-size:13px;margin-top:12px;display:none;}
.demo-hint{text-align:center;margin-top:14px;font-size:12px;color:var(--tmu);}
/* SHELL */
#appShell{display:none;}
.app{display:flex;min-height:100vh;}
.sidebar{width:232px;background:var(--f);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;}
.sb-head{padding:20px 16px 16px;border-bottom:1px solid rgba(201,168,76,.12);}
.sb-logo-row{display:flex;align-items:center;gap:10px;}
.sb-logo-icon{width:36px;height:36px;background:var(--g);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-logo-icon i{font-size:18px;color:var(--f);}
.sb-logo-name{font-size:13px;font-weight:700;color:#fff;line-height:1.25;}
.sb-logo-tag{font-size:9px;color:var(--g);letter-spacing:1.5px;text-transform:uppercase;}
.sb-role-badge{display:inline-flex;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.25);color:var(--g);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:50px;margin-top:9px;}
.sb-nav{padding:12px 8px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;}
.nav-sec{font-size:9px;font-weight:700;color:rgba(255,255,255,.22);letter-spacing:1.5px;text-transform:uppercase;padding:9px 10px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r);cursor:pointer;color:rgba(255,255,255,.48);font-size:12.5px;font-weight:500;border:none;background:none;text-align:left;width:100%;transition:all .18s;}
.nav-item i{width:15px;text-align:center;font-size:13px;}
.nav-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);}
.nav-item.active{background:var(--g);color:var(--f);font-weight:700;}
.sb-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.05);}
.sb-user{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
.sb-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:var(--g);color:var(--f);}
.sb-uname{font-size:12px;color:rgba(255,255,255,.85);font-weight:600;}
.sb-urole{font-size:10.5px;color:rgba(255,255,255,.32);}
.logout-btn{width:100%;padding:7px;border-radius:var(--r);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.4);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.logout-btn:hover{background:rgba(201,168,76,.15);color:var(--g);}
/* TOPBAR */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--w);border-bottom:1px solid var(--bd);padding:0 22px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-shrink:0;position:relative;z-index:50;}
.topbar-title{font-size:15px;font-weight:700;color:var(--f);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.notif-btn{position:relative;width:34px;height:34px;border-radius:50%;background:var(--cr);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--tm);}
.notif-badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:#e74c3c;color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px;}
.notif-panel{position:absolute;top:56px;right:14px;width:330px;background:var(--w);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--bm);z-index:200;display:none;}
.notif-panel.open{display:block;}
.notif-ph{padding:12px 15px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.notif-ph-t{font-size:13px;font-weight:700;color:var(--f);}
.notif-item{padding:11px 15px;border-bottom:1px solid rgba(14,45,30,.04);cursor:pointer;}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--cr);}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0;display:inline-block;margin-right:8px;}
/* CONTENT */
.content{flex:1;padding:22px;overflow-y:auto;}
/* CARDS */
.card{background:var(--w);border-radius:var(--rl);padding:18px;border:1px solid var(--bd);box-shadow:var(--bs);margin-bottom:14px;}
.card-hd{font-size:13px;font-weight:700;color:var(--f);margin-bottom:13px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-hd a{font-size:11px;color:var(--g);font-weight:600;cursor:pointer;}
/* STATS */
.sg{display:grid;gap:12px;margin-bottom:16px;}
.s4{grid-template-columns:repeat(4,1fr);}
.s3{grid-template-columns:repeat(3,1fr);}
.s2{grid-template-columns:repeat(2,1fr);}
.sc{background:var(--w);border-radius:var(--rl);padding:18px 16px;border:1px solid var(--bd);box-shadow:var(--bs);}
.stl{font-size:10.5px;color:var(--tmu);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
.stv{font-size:24px;font-weight:700;color:var(--f);line-height:1;}
.sts{font-size:11px;color:var(--tl);margin-top:4px;}
.sti{float:right;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.ic-g{background:rgba(201,168,76,.12);}.ic-f{background:rgba(14,45,30,.08);}
.ic-g i{color:var(--g);font-size:15px;}.ic-f i{color:var(--fl);font-size:15px;}
/* CLASS TABS */
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.ctab{padding:6px 14px;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--bd);background:var(--w);color:var(--tm);transition:all .15s;font-family:inherit;}
.ctab:hover{border-color:var(--g);color:var(--f);}
.ctab.active{background:var(--f);color:#fff;border-color:var(--f);}
/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--tmu);font-weight:700;padding:8px 12px;text-align:left;border-bottom:1.5px solid var(--bd);}
td{padding:10px 12px;font-size:12.5px;color:var(--tm);border-bottom:1px solid rgba(14,45,30,.04);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(14,45,30,.012);}
.ac{display:flex;align-items:center;gap:8px;}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--cr);color:var(--f);border:1.5px solid var(--bd);overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.an{font-weight:600;color:var(--f);font-size:12.5px;}
.as{font-size:11px;color:var(--tmu);}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:50px;font-size:10.5px;font-weight:600;}
.bg-green{background:#e7f4ee;color:#1a6b3c;}
.bg-amber{background:#fef3e2;color:#8a5c0a;}
.bg-red{background:#fde8e8;color:#9b2626;}
.bg-blue{background:#e6f1fb;color:#1a4fa0;}
.bg-purple{background:#f0ebff;color:#5b21b6;}
.bg-gray{background:#f0f0ee;color:#555;}
/* BTN */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 15px;border-radius:50px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .18s;white-space:nowrap;}
.btn i{font-size:11px;}
.bg{background:var(--g);color:var(--f);}.bg:hover{background:var(--gb);}
.bf{background:var(--f);color:#fff;}.bf:hover{background:var(--fm);}
.bo{background:transparent;color:var(--f);border:1.5px solid var(--bdm);}.bo:hover{background:var(--cr);}
.btn-sm{padding:4px 11px;font-size:11px;}
.btn-xs{padding:3px 8px;font-size:10.5px;}
.abt{width:26px;height:26px;border-radius:6px;background:var(--cr);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--tm);transition:all .15s;margin-right:2px;}
.abt:hover{background:var(--f);color:#fff;}
.abt i{font-size:11px;}
/* FORM */
.fg{display:grid;gap:12px;}
.fg2{grid-template-columns:1fr 1fr;}
.fg3{grid-template-columns:1fr 1fr 1fr;}
.ff{display:flex;flex-direction:column;gap:4px;}
.ff label{font-size:11px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;}
.ff input,.ff select,.ff textarea{padding:9px 12px;border:1.5px solid var(--bd);border-radius:var(--r);font-size:13px;color:var(--td);background:var(--cr);outline:none;font-family:inherit;transition:border .2s;}
.ff input:focus,.ff select:focus,.ff textarea:focus{border-color:var(--g);background:var(--w);}
.ff textarea{min-height:75px;resize:vertical;}
.fa{display:flex;gap:9px;justify-content:flex-end;margin-top:5px;}
/* MISC */
.prog{height:5px;background:rgba(14,45,30,.08);border-radius:3px;overflow:hidden;margin-top:4px;}
.prog-f{height:100%;border-radius:3px;background:var(--g);}
.ir{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);}
.ir:last-child{border-bottom:none;}
.irl{font-size:11.5px;color:var(--tmu);}
.irv{font-size:13px;font-weight:600;color:var(--f);}
.notice{background:var(--cr);border-radius:var(--rl);padding:13px 15px;border-left:3px solid var(--g);margin-bottom:9px;}
.notice-title{font-size:12.5px;font-weight:700;color:var(--f);}
.notice-date{font-size:10.5px;color:var(--tmu);margin-top:3px;}
.sr{display:flex;align-items:center;gap:11px;margin-bottom:10px;}
.sl{font-size:12.5px;font-weight:600;color:var(--f);width:95px;flex-shrink:0;}
.sb{flex:1;height:8px;background:rgba(14,45,30,.08);border-radius:4px;overflow:hidden;}
.sf{height:100%;border-radius:4px;}
.sn{font-size:12.5px;font-weight:700;color:var(--f);width:32px;text-align:right;}
.loader{text-align:center;padding:36px;color:var(--tmu);font-size:13px;}
.loader i{font-size:22px;animation:spin 1s linear infinite;display:block;margin-bottom:9px;color:var(--g);}
@keyframes spin{to{transform:rotate(360deg);}}
/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--f);color:#fff;padding:11px 18px;border-radius:var(--rl);font-size:13px;font-weight:600;z-index:9999;display:none;align-items:center;gap:9px;box-shadow:var(--bm);}
.toast.show{display:flex;}
.toast.err{background:#9b2626;}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--g);}
/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:999;}
.mo.open{display:flex;}
.modal{background:var(--w);border-radius:20px;padding:26px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto;}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.mhd-t{font-size:15px;font-weight:700;color:var(--f);}
.mhd-x{width:28px;height:28px;border-radius:50%;background:var(--cr);border:none;cursor:pointer;font-size:15px;color:var(--tl);}
/* ATTENDANCE */
.att-row{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--cr);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:7px;}
.att-n{flex:1;font-size:12.5px;font-weight:600;color:var(--f);}
.att-btn{padding:4px 11px;border-radius:50px;border:1.5px solid var(--bd);background:transparent;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
.att-p.sel{background:#1a6b3c;color:#fff;border-color:#1a6b3c;}
.att-l.sel{background:#8a5c0a;color:#fff;border-color:#8a5c0a;}
.att-a.sel{background:#9b2626;color:#fff;border-color:#9b2626;}
/* TIMETABLE */
.tt-cell{background:var(--gp);border-radius:5px;padding:4px 7px;font-size:11px;font-weight:600;color:var(--f);cursor:pointer;min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid rgba(201,168,76,.2);}
.tt-empty{background:rgba(14,45,30,.03);border-radius:5px;min-height:32px;cursor:pointer;border:1.5px dashed rgba(14,45,30,.1);display:flex;align-items:center;justify-content:center;color:var(--tmu);font-size:11px;}
.tt-empty:hover{border-color:var(--g);background:var(--gp);}
/* RECEIPT */
.receipt{background:var(--w);border:2px solid var(--f);border-radius:var(--rl);padding:26px;max-width:400px;margin:0 auto;}
.r-hd{text-align:center;border-bottom:2px dashed var(--bd);padding-bottom:14px;margin-bottom:14px;}
.r-logo{font-size:18px;font-weight:700;color:var(--f);}
.r-sub{font-size:11px;color:var(--tmu);}
.r-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12.5px;}
.r-total{border-top:2px solid var(--f);margin-top:9px;padding-top:9px;font-weight:700;font-size:14px;}
.r-stamp{text-align:center;margin-top:14px;padding:9px;background:var(--cr);border-radius:var(--r);}
/* GRADE COLORS */
.g-dist{color:#1a6b3c;}.g-credit{color:#1a4fa0;}.g-pass{color:#8a5c0a;}.g-fail{color:#9b2626;}
/* REPORT CARD */
.rc{background:var(--w);border:2px solid var(--f);border-radius:var(--rl);padding:28px;max-width:560px;margin:0 auto;}
.rc-hd{text-align:center;padding-bottom:16px;margin-bottom:16px;border-bottom:3px double var(--g);}
.rc-school{font-size:20px;font-weight:700;color:var(--f);}
.rc-motto{font-size:11px;color:var(--g);letter-spacing:1px;text-transform:uppercase;}
.rc-title{font-size:14px;font-weight:700;color:var(--f);margin-top:10px;border:1px solid var(--bd);padding:5px 20px;border-radius:50px;display:inline-block;}
.rc-info{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;}
.rc-info-item{padding:7px 13px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);}
.rc-info-item:nth-child(even){border-right:none;}
.rc-il{font-size:10px;color:var(--tmu);text-transform:uppercase;}
.rc-iv{font-size:12.5px;font-weight:600;color:var(--f);}
.rc-table th{background:var(--f);color:var(--g);}
.rc-comment{margin-top:14px;padding:12px 14px;background:var(--cr);border-radius:var(--r);border-left:3px solid var(--g);}
.rc-sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:20px;text-align:center;}
.rc-sig-line{border-top:1px solid var(--f);padding-top:5px;font-size:11px;color:var(--tmu);}
/* EVENTS */
.ev-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd);}
.ev-item:last-child{border-bottom:none;}
.ev-date-box{width:44px;flex-shrink:0;text-align:center;background:var(--f);border-radius:var(--r);padding:6px 4px;}
.ev-day{font-size:18px;font-weight:700;color:var(--g);line-height:1;}
.ev-mon{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;}
.ev-body{flex:1;}
.ev-title{font-size:13px;font-weight:700;color:var(--f);}
.ev-desc{font-size:11.5px;color:var(--tmu);margin-top:2px;}
/* PAYROLL */
.pay-status-paid{color:#1a6b3c;font-weight:700;}
.pay-status-pending{color:#8a5c0a;font-weight:700;}
/* PHOTO UPLOAD */
.photo-upload{width:80px;height:80px;border-radius:50%;border:2px dashed var(--g);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;overflow:hidden;background:var(--cr);}
.photo-upload img{width:100%;height:100%;object-fit:cover;}
.photo-upload span{font-size:11px;color:var(--tmu);text-align:center;}
/* PARENT PORTAL */
.parent-hero{background:linear-gradient(135deg,var(--f),var(--fl));border-radius:var(--rl);padding:24px;margin-bottom:16px;color:#fff;}
/* GRADING */
.grade-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);}
.grade-row:last-child{border-bottom:none;}
/* SETTINGS */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--bd);}
.setting-row:last-child{border-bottom:none;}
.setting-label{font-size:13px;font-weight:600;color:var(--f);}
.setting-desc{font-size:11.5px;color:var(--tmu);margin-top:2px;}
/* ANALYTICS */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:8px;height:120px;margin-bottom:8px;}
.chart-bar{flex:1;border-radius:4px 4px 0 0;background:linear-gradient(to top,var(--f),var(--fl));transition:height .4s;}
.chart-label{font-size:10px;color:var(--tmu);text-align:center;}
@media print{.sidebar,.topbar,.fa,.abt,.btn,.mo-footer{display:none!important;}.mo{position:static;background:none;}.modal{max-height:none;box-shadow:none;}}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="login-title">Visionary Junior School</div>
      <div class="login-sub">School Management System v3.0</div>
    </div>
    <div class="fl"><label>Email</label><input id="lEmail" type="email" placeholder="your@email.com"></div>
    <div class="fl"><label>Password</label><input id="lPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div style="margin-bottom:18px;">
      <div style="font-size:11px;font-weight:600;color:var(--tm);letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;">Login As</div>
      <div class="role-tabs">
        <button class="role-tab sel" onclick="fillD('admin',this)"><i class="fas fa-shield-alt"></i>Admin</button>

function fillD(role,btn){document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('sel'));btn.classList.add('sel');document.getElementById('lEmail').value=DEMO[role].email;document.getElementById('lPass').value=DEMO[role].password;}

function ini(n){return(n||'').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function fmtUGX(n){return'UGX '+parseInt(n||0).toLocaleString();}
function today(){return new Date().toISOString().split('T')[0];}
function getGrade(score){return GRADING.find(g=>score>=g.min&&score<=g.max)||GRADING[3];}
function gradeBadge(score){const g=getGrade(score);return`<span class="badge" style="background:${g.bg};color:${g.color}">${g.label}</span>`;}
function gradeLabel(score){return getGrade(score).label;}
function feeStatus(due,paid){return paid>=due?'Paid':paid>0?'Partial':'Unpaid';}
function fBadge(s){return s==='Paid'?'bg-green':s==='Partial'?'bg-amber':'bg-red';}
function sBadge(s){return s==='Active'?'bg-green':'bg-amber';}

function cTabs(list,active,containerId,renderFn){
  return`<div class="ctabs" id="tabs_${containerId}">${['All',...list].map(c=>`<button class="ctab${c===active?' active':''}" data-val="${c}" onclick="handleTab(this,'${containerId}',${renderFn})">${c}</button>`).join('')}</div>`;
}
function handleTab(btn,containerId,fn){
  document.querySelectorAll(`#tabs_${containerId} .ctab`).forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  fn(btn.dataset.val);
}
// Simple tab builder — pass render function name as string
function buildTabs(classes,activeClass,onClickFnStr){
  return`<div class="ctabs">${['All',...classes].map(c=>`<button class="ctab${c===activeClass?' active':''}" onclick="document.querySelectorAll('.ctabs .ctab').forEach(t=>t.classList.remove('active'));this.classList.add('active');${onClickFnStr}('${c}')">${c}</button>`).join('')}</div>`;
}

async function doLogin(){
  const email=document.getElementById('lEmail').value.trim();
  const pass=document.getElementById('lPass').value;
  const btn=document.getElementById('lBtn');
  const err=document.getElementById('lErr');
  if(!email||!pass){err.textContent='Enter email and password.';err.style.display='block';return;}
  // Handle parent demo locally (no backend endpoint)
  if(email===DEMO.parent.email&&pass===DEMO.parent.password){
    localStorage.setItem('vsToken','demo-parent');
    localStorage.setItem('vsUser',JSON.stringify({role:'parent',fullName:'Mrs. Sarah Kato',email}));
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appShell').style.display='block';
    buildShell({role:'parent',fullName:'Mrs. Sarah Kato',email});
    loadNotifs();return;
  }
  btn.disabled=true;btn.textContent='Signing in...';err.style.display='none';
  try{
    const data=await Auth.login(email,pass);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appShell').style.display='block';
    buildShell(data.user);loadNotifs();
  }catch(e){err.textContent=e.message||'Login failed.';err.style.display='block';}
  finally{btn.disabled=false;btn.textContent='Sign In';}
}
function doLogout(){Auth.logout();document.getElementById('appShell').style.display='none';document.getElementById('loginScreen').style.display='flex';}

function buildShell(user){
  const role=user.role;
  document.getElementById('roleBadge').textContent=role.charAt(0).toUpperCase()+role.slice(1);
  document.getElementById('sbAv').textContent=ini(user.fullName||user.email);
  document.getElementById('sbName').textContent=user.fullName||user.email;
  document.getElementById('sbRole').textContent=role;
  const nav=document.getElementById('sideNav');nav.innerHTML='';
  (NAV[role]||[]).forEach(sec=>{
    const s=document.createElement('div');s.className='nav-sec';s.textContent=sec.sec;nav.appendChild(s);
    sec.items.forEach(item=>{
      const b=document.createElement('button');b.className='nav-item';
      b.innerHTML=`<i class="fas ${item.icon}"></i>${item.label}`;
      b.dataset.id=item.id;b.dataset.label=item.label;
      b.onclick=()=>navTo(item.id,item.label,b);
      nav.appendChild(b);
    });
  });
  const firstItem=NAV[role][0].items[0];
  document.querySelector('.nav-item')?.classList.add('active');
  document.getElementById('pgTitle').textContent=firstItem.label;
  renderPage(firstItem.id);
}
function navTo(id,label,btn){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));

  renderPage(id);
}

}
